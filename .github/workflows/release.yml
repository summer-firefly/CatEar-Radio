name: Release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles dmg
      - name: Rename the bundle for the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            cp "$f" "out/CatEar-Radio_${version}_aarch64.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: out/*.dmg

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - name: Rename the bundle for the release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            cp "$f" "out/CatEar-Radio_${version}_x64-setup.exe"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*.exe

  android:
    name: Android universal APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `tools` was dropped from the SDK, so only ask for what still exists.
          packages: "platform-tools"
      - name: Install the NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install the system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set; the APK would be unsigned."
            exit 1
          fi
          mkdir -p src-tauri/android-signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > src-tauri/android-signing/catear-release-v2.jks
          {
            echo "storeFile=catear-release-v2.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=catear"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > src-tauri/android-signing/keystore.properties
      - run: npx tauri android build --apk
      - name: Rename the bundle for the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp "src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk" \
             "out/CatEar-Radio_${version}_universal-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  publish:
    name: Publish the GitHub release
    needs: [macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: 猫耳收音机 ${{ github.ref_name }}
          files: out/*
          generate_release_notes: false
          body: |
            见仓库提交记录了解本次改动。
